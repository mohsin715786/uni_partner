name: uni_partner
description: "UniPartner - Your Local Student Companion"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0
  flutter_secure_storage: ^9.2.2
  crypto: ^3.0.6
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/branding/unipartner_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#F8F3EA"
  adaptive_icon_foreground: "assets/branding/unipartner_icon.png"

flutter_native_splash:
  color: "#F8F3EA"
  image: "assets/branding/unipartner_icon.png"
  android_12:
    image: "assets/branding/unipartner_icon.png"
    icon_background_color: "#F8F3EA"

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/screenshots/
